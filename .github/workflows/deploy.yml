name: Zola on GitHub Pages
on:
  push:
    branches:
      - main 
  # This allows you to run the build manually from the Actions tab if needed
  workflow_dispatch: 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Build Zola + upload Pages artifact
        # This uses a specific, stable commit of the Zola action
        uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
        with:
          # This is where you specify the version of Zola to use for the build
          zola_version: v0.22.0

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
